{% extends 'base.html' %}

{% block content %}
<article>
    <h2>Excluir funcionário</h2>
    <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="secondary">Excluir</button>
        <a href="{% url 'person:employee_list' %}">Cancelar</a>
    </form>
</article>
{% endblock %}
