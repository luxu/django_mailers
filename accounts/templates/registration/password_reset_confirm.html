{% extends 'base.html' %}

{% block content %}
<article>
    {% if validlink %}
        <h2>Nova senha</h2>
        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Salvar senha</button>
        </form>
    {% else %}
        <h2>Link inválido</h2>
        <p>Este link já foi usado ou expirou.</p>
        <a href="{% url 'password_reset' %}">Pedir um link novo</a>
    {% endif %}
</article>
{% endblock %}
